
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071a2d">
<title>کمال هات‌اسپات</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px 14px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#164b6b,#061626 70%);color:#f2f8ff;font-family:Tahoma,Arial,sans-serif}
.app{width:100%;max-width:420px}
.brand{text-align:center;margin-bottom:20px}
.logo{width:76px;height:76px;margin:0 auto 12px;border-radius:24px;display:grid;place-items:center;font-size:40px;color:#062033;background:linear-gradient(135deg,#35d7f2,#43e39a)}
h1{margin:0;font-size:25px}
.subtitle{color:#a9c0d4;font-size:13px}
.card{padding:22px;border:1px solid #2b526e;border-radius:22px;background:linear-gradient(160deg,#102d47,#091e31);box-shadow:0 20px 55px #0005}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px;margin-bottom:22px;border:1px solid #234761;border-radius:14px;background:#071b2b}
.small{font-size:12px;color:#a9c0d4;margin-bottom:6px}
.speed{font-size:12px;color:#35d7f2;white-space:nowrap}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:9px}
.field{display:flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid #315772;border-radius:13px;background:#061a2b}
.field:focus-within{border-color:#35d7f2}
input{width:100%;min-width:0;padding:12px 3px;border:0;outline:0;background:transparent;color:white;font:15px Tahoma;direction:ltr;text-align:left;text-transform:uppercase}
input::placeholder{color:#7894aa}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:13px;background:linear-gradient(90deg,#35d7f2,#43e39a);color:#062033;font:bold 16px Tahoma;cursor:pointer}
.message{display:none;margin-top:14px;padding:12px;border-radius:12px;text-align:center;font-size:13px;line-height:1.9}
.message.show{display:block}
.success{color:#7af0b5;background:#0b3a32;border:1px solid #237a61}
.error{color:#ffaaaa;background:#401e2a;border:1px solid #824052}
.hint{font-size:12px;line-height:1.9;color:#a9c0d4}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.feature{padding:12px 4px;text-align:center;border:1px solid #1f4058;border-radius:12px;background:#0b2135;font-size:12px;color:#a9c0d4}
.feature b{display:block;font-size:20px;margin-bottom:6px}
footer{text-align:center;color:#7894aa;font-size:11px;line-height:1.9;margin-top:18px}
</style>
</head>
<body>
<main class="app">
<header class="brand">
<div class="logo">⌁</div>
<h1>کمال هات‌اسپات</h1>
<p class="subtitle">به شبکه وای‌فای کمال خوش آمدید</p>
</header>
<section class="card">
<div class="status">
<div><div class="small">وضعیت صفحه</div><b>آماده دریافت کد</b></div>
<div class="speed">سرعت نمایشی: ۳ Mbps</div>
</div>
<form id="connectForm">
<label for="wifiCode">کد وای‌فای را وارد کنید</label>
<div class="field">
<span>🔐</span>
<input id="wifiCode" type="text" placeholder="مثلاً KAMAL-7A2K" maxlength="24" autocomplete="off" required>
</div>
<button type="submit">بررسی کد و اتصال</button>
<div id="message" class="message" role="status" aria-live="polite"></div>
</form>
<p class="hint">کد را دقیق وارد کنید. فقط کدهای ثبت‌شده پذیرفته می‌شوند.</p>
<div class="features">
<div class="feature"><b>📶</b>وای‌فای</div>
<div class="feature"><b>🔐</b>بررسی کد</div>
<div class="feature"><b>⚡</b>۳ Mbps</div>
</div>
</section>
<footer>کمال هات‌اسپات<br>برای اتصال واقعی اینترنت، سیستم هات‌اسپات باید به روتر یا سرور وصل باشد.</footer>
</main>
<script>
const validCodes = new Set([
"KAMAL-7A2K","KAMAL-9B4M","KAMAL-3C8N","KAMAL-5D1P",
"KAMAL-6E7R","KAMAL-2F9T","KAMAL-8G3W","KAMAL-4H6X",
"KAMAL-1J5Y","KAMAL-7L2Z","WIFI-A82K","WIFI-B93M",
"WIFI-C14N","WIFI-D65P","WIFI-E27R","WIFI-F38T",
"WIFI-G49W","WIFI-H51X","WIFI-J72Y","WIFI-K84Z"
]);
const form=document.getElementById("connectForm");
const input=document.getElementById("wifiCode");
const message=document.getElementById("message");

form.addEventListener("submit",function(event){
  event.preventDefault();
  const code=input.value.trim().toUpperCase();
  message.className="message show";
  if(!code){
    message.classList.add("error");
    message.textContent="لطفاً کد را وارد کنید.";
  }else if(!validCodes.has(code)){
    message.classList.add("error");
    message.textContent="❌ کد نامعتبر است. دوباره بررسی کنید.";
  }else{
    message.classList.add("success");
    message.textContent="✅ کد معتبر است؛ بررسی موفق بود. این پیام نمایشی است و اینترنت واقعی هنوز وصل نشده است.";
  }
});
</script>
</body>
</html>
